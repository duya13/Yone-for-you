name: Deploy Vue Site to GitHub Pages

on:
  push:
    branches: [ main ] # 监听 main 分支的提交：每次 push 都自动重新构建并发布
  workflow_dispatch: # 允许在 Actions 页面手动点「Run workflow」触发（推送事件没触发时的兜底）

# GitHub Pages 的官方部署方式要求在 workflow 里显式声明这三项权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一个时间只允许有一个部署在跑；新的提交直接取消上一次没跑完的部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 这一步会读取 .env.production（Hash 路由）并按 vite.config.js 里的 base 打包
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
